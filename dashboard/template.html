<title>Overlay Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#eef1f4; --panel:#ffffff; --sunk:#f6f8f9; --rail:#12171d; --rail-2:#1b222a;
  --line:#dce2e8; --line-2:#e9edf1;
  --ink:#131920; --ink-2:#4a5763; --ink-3:#7b8894; --ink-4:#a3adb8;
  --rail-ink:#e9eef3; --rail-ink-2:#8e9aa6;
  --a:#A16207; --d:#1D6FA8; --alone:#96a1ac;
  --pos:#2a78d6; --neg:#d03b3b;
  --good:#0a8f0a; --crit:#d03b3b; --warn:#c98500;
  --sh:0 1px 2px rgba(19,25,32,.05);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1116; --panel:#161c23; --sunk:#1b222a; --rail:#0a0e12; --rail-2:#141a21;
    --line:#28313b; --line-2:#1f272f;
    --ink:#e7edf3; --ink-2:#a5b2be; --ink-3:#7d8b97; --ink-4:#5e6b77;
    --rail-ink:#e7edf3; --rail-ink-2:#78848f;
    --a:#C4870F; --d:#4A97CE; --alone:#68737e;
    --pos:#3987e5; --neg:#e06060;
    --good:#4caf50; --crit:#e06060; --warn:#e0a63a;
    --sh:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1116; --panel:#161c23; --sunk:#1b222a; --rail:#0a0e12; --rail-2:#141a21;
  --line:#28313b; --line-2:#1f272f;
  --ink:#e7edf3; --ink-2:#a5b2be; --ink-3:#7d8b97; --ink-4:#5e6b77;
  --rail-ink:#e7edf3; --rail-ink-2:#78848f;
  --a:#C4870F; --d:#4A97CE; --alone:#68737e;
  --pos:#3987e5; --neg:#e06060;
  --good:#4caf50; --crit:#e06060; --warn:#e0a63a;
  --sh:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--good)} .dn{color:var(--crit)}

/* ── shell ─────────────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
@media(max-width:920px){.app{grid-template-columns:1fr}}

.rail{background:var(--rail);color:var(--rail-ink);padding:22px 0 28px;
  display:flex;flex-direction:column;gap:26px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
@media(max-width:920px){.rail{position:static;height:auto;padding-bottom:18px}}
.rail .pad{padding-inline:20px}
.brand{display:flex;align-items:center;gap:9px}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--a);flex:none;
  box-shadow:0 0 0 3px color-mix(in oklab,var(--a) 22%,transparent)}
.brand b{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;font:500 10px/1.4 var(--mono);letter-spacing:.1em;
  text-transform:uppercase;color:var(--rail-ink-2);margin-top:2px}

.rlab{font:600 10px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--rail-ink-2);padding-inline:20px;margin-bottom:9px}
.rnav{display:flex;flex-direction:column;gap:1px}
.rnav button{appearance:none;border:0;background:transparent;color:var(--rail-ink-2);
  cursor:pointer;font:500 13.5px/1 var(--sans);text-align:left;
  padding:10px 20px;display:flex;align-items:center;gap:10px;
  border-left:2px solid transparent}
.rnav button:hover{color:var(--rail-ink)}
.rnav button[aria-selected="true"]{color:var(--rail-ink);background:var(--rail-2);
  border-left-color:var(--sel)}
.rnav button:focus-visible{outline:2px solid var(--d);outline-offset:-2px}
.rnav i{width:14px;height:14px;flex:none;opacity:.85}
@media(max-width:920px){
  .rnav{flex-direction:row;overflow-x:auto;gap:0}
  .rnav button{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;padding:12px 16px}
  .rnav button[aria-selected="true"]{border-bottom-color:var(--sel);background:transparent}
}
.rseg{display:flex;gap:2px;background:var(--rail-2);border-radius:7px;padding:3px;
  margin-inline:20px}
.rseg button{flex:1;appearance:none;border:0;background:transparent;color:var(--rail-ink-2);
  font:500 12px/1 var(--sans);padding:8px 4px;border-radius:5px;cursor:pointer}
.rseg button[aria-pressed="true"]{background:var(--rail);color:var(--rail-ink)}
.rseg button:focus-visible{outline:2px solid var(--d);outline-offset:1px}
.rmeta{margin-top:auto;padding-inline:20px;font:400 11px/1.6 var(--mono);
  color:var(--rail-ink-2)}
.rmeta div{display:flex;justify-content:space-between;gap:8px}
@media(max-width:920px){.rmeta{display:none}}

/* ── main ──────────────────────────────────────────────────────────────── */
main{min-width:0;padding:24px 28px 56px}
@media(max-width:600px){main{padding:18px 16px 40px}}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:baseline;
  justify-content:space-between;margin-bottom:20px}
.head h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.02em}
.head p{margin:4px 0 0;font-size:12.5px;color:var(--ink-2);max-width:78ch}
.chip{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-2);background:var(--panel);border:1px solid var(--line);
  border-radius:99px;padding:6px 11px;white-space:nowrap}

.g{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}
.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media(max-width:1080px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}

.p{background:var(--panel);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--sh);display:flex;flex-direction:column}
.p>.ph{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:14px 18px;border-bottom:1px solid var(--line-2)}
.p>.ph h2{margin:0;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.p>.ph .sub{margin:3px 0 0;font-size:11.5px;color:var(--ink-3);font-weight:400}
.p>.ph .rt{font:500 11px/1 var(--mono);color:var(--ink-3);white-space:nowrap}
.p>.pb{padding:18px}
.p>.pb.flush{padding:0}
.note{font-size:11.5px;color:var(--ink-3);line-height:1.55;margin:14px 0 0;max-width:80ch}

/* ── stat band ─────────────────────────────────────────────────────────── */
.band{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--sh)}
@media(max-width:1080px){.band{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.band{grid-template-columns:repeat(2,1fr)}}
.band .s{background:var(--panel);padding:15px 16px 16px}
.band .k{font:600 10px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3)}
.band .v{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.02em;
  margin-top:7px;font-variant-numeric:tabular-nums;line-height:1.1}
.band .d{font:400 11.5px/1.4 var(--mono);margin-top:4px;color:var(--ink-3)}

/* compact stat list inside a panel */
.kv{display:flex;flex-direction:column}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;
  border-bottom:1px solid var(--line-2);font-size:12.5px}
.kv div:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-2)}
.kv span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}

/* ── charts ────────────────────────────────────────────────────────────── */
svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line-2);stroke-width:1}
.ax{fill:var(--ink-3);font-family:var(--mono);font-size:10px}
.zero{stroke:var(--ink-4);stroke-width:1}
.dl{font-family:var(--mono);font-size:10.5px;font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:8px 18px;margin:0 0 14px;padding:0;list-style:none;
  font-size:11.5px;color:var(--ink-2)}
.lg li{display:flex;align-items:center;gap:7px}
.sw{width:14px;height:3px;border-radius:2px;flex:none}
.sw.b{height:10px;border-radius:2px}
.sw.dash{background:repeating-linear-gradient(90deg,var(--alone) 0 5px,transparent 5px 9px)}

.tip{position:fixed;pointer-events:none;z-index:70;background:var(--rail);
  color:var(--rail-ink);border-radius:7px;padding:9px 11px;box-shadow:0 6px 20px rgba(0,0,0,.28);
  font-size:11.5px;opacity:0;transition:opacity .08s;min-width:146px}
.tip[data-on="1"]{opacity:1}
.tip b{display:block;font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;
  color:var(--rail-ink-2);margin-bottom:7px}
.tip .r{display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);
  font-variant-numeric:tabular-nums;padding:1px 0}
.tip .r span:first-child{color:var(--rail-ink-2)}

/* ── tables ────────────────────────────────────────────────────────────── */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:560px}
th,td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{position:sticky;top:0;background:var(--sunk);z-index:1;
  font:600 10px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
th:first-child,td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:0}
tbody tr.hi td{background:var(--sunk);font-weight:600}
tbody tr.sep td{border-top:1px solid var(--line)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
td .tag{font:600 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  padding:3px 6px;border-radius:4px;background:var(--sunk);color:var(--ink-3)}

/* ── heatmap ───────────────────────────────────────────────────────────── */
.hmw{overflow-x:auto}
.hm{display:grid;grid-template-columns:44px repeat(12,1fr);gap:2px;min-width:640px}
.hm div{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;border-radius:3px;height:32px}
.hm .hh{color:var(--ink-3);font-weight:600;height:20px}
.hm .yr{color:var(--ink-2);font-weight:600;justify-content:flex-end;padding-right:8px}
.scale{display:flex;align-items:center;gap:8px;margin-top:14px;font:500 10.5px var(--mono);
  color:var(--ink-3)}
.scale .ramp{height:8px;flex:1;max-width:220px;border-radius:2px;
  background:linear-gradient(90deg,var(--neg),var(--sunk),var(--pos))}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="app">
  <aside class="rail">
    <div class="pad brand">
      <span class="dot"></span>
      <div><b>Overlay Desk</b><span id="brandSub">Model A</span></div>
    </div>

    <div>
      <div class="rlab">Book</div>
      <div class="rseg" role="group" aria-label="Select book">
        <button data-book="A" aria-pressed="true">Model A</button>
        <button data-book="D" aria-pressed="false">Model D</button>
        <button data-book="C" aria-pressed="false">Both</button>
      </div>
    </div>

    <div>
      <div class="rlab">Views</div>
      <div class="rnav" role="tablist">
        <button role="tab" data-v="ov" aria-selected="true"><i>◧</i>Overview</button>
        <button role="tab" data-v="pf" aria-selected="false"><i>▤</i>Performance</button>
        <button role="tab" data-v="rk" aria-selected="false"><i>◣</i>Risk</button>
        <button role="tab" data-v="en" aria-selected="false"><i>◈</i>Option engine</button>
        <button role="tab" data-v="tr" aria-selected="false"><i>≡</i>Trade log</button>
      </div>
    </div>

    <div class="rmeta" id="rmeta"></div>
  </aside>

  <main>
    <div class="head">
      <div><h1 id="vT"></h1><p id="vS"></p></div>
      <span class="chip" id="vC"></span>
    </div>
    <div class="g" id="view"></div>
  </main>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
const D = __DATA__;
const CAP = 1e7;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $ = s => document.querySelector(s);
let book = "A", view = "ov";

const pc  = v => (v>=0?"+":"") + v.toFixed(2) + "%";
const rs  = v => { const s=v<0?"−":"", n=Math.abs(v);
  if(n>=1e7) return s+"₹"+(n/1e7).toFixed(2)+" Cr";
  if(n>=1e5) return s+"₹"+(n/1e5).toFixed(2)+" L";
  return s+"₹"+Math.round(n).toLocaleString("en-IN"); };
const hue = b => b==="D" ? "var(--d)" : "var(--a)";
const K   = () => book==="C" ? "A" : book;
const B   = () => D.books[K()];

/* ── tooltip ───────────────────────────────────────────────────────────── */
const tip = $("#tip");
function showTip(e,t,rows){
  tip.innerHTML = "<b>"+t+"</b>"+rows.map(r=>
    `<div class="r"><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
  tip.dataset.on="1";
  const w=tip.offsetWidth,h=tip.offsetHeight;
  let x=e.clientX+16,y=e.clientY-h-12;
  if(x+w>innerWidth-8) x=e.clientX-w-16;
  if(y<8) y=e.clientY+18;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
const hideTip=()=>tip.dataset.on="0";
addEventListener("scroll",hideTip,{passive:true});
function bind(node,t,rows){
  node.addEventListener("pointerenter",e=>showTip(e,t,rows));
  node.addEventListener("pointermove",e=>showTip(e,t,rows));
  node.addEventListener("pointerleave",hideTip);
}

/* ── building blocks ───────────────────────────────────────────────────── */
const panel = (cls,title,sub,right,body,note) => `
  <section class="p ${cls}">
    <div class="ph">
      <div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:""}</div>
      ${right?`<span class="rt">${right}</span>`:""}
    </div>
    <div class="pb${cls.includes("flush")?" flush":""}">${body}${note?`<p class="note">${note}</p>`:""}</div>
  </section>`;
const legend = items => `<ul class="lg">${items.map(i=>
  `<li><span class="sw ${i.bar?"b":""} ${i.dash?"dash":""}" style="${i.dash?"":"background:"+i.c}"></span>${i.t}</li>`).join("")}</ul>`;
const nice = x => { const p=Math.pow(10,Math.floor(Math.log10(Math.abs(x)||1))),n=x/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p; };

/* line / area chart -------------------------------------------------- */
function line(node,series,o){
  const W=960,H=o.h||280,P={t:14,r:o.r??62,b:26,l:o.l??48};
  const n=series[0].v.length;
  let lo=Infinity,hi=-Infinity;
  series.forEach(s=>s.v.forEach(v=>{ if(v==null)return; lo=Math.min(lo,v);hi=Math.max(hi,v); }));
  lo=Math.min(lo,0);hi=Math.max(hi,0);
  const pad=(hi-lo)*.08||1; lo-=pad; hi+=pad;
  const X=i=>P.l+i*(W-P.l-P.r)/(n-1), Y=v=>P.t+(hi-v)*(H-P.t-P.b)/(hi-lo);
  const st=nice((hi-lo)/4); let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}">`;
  for(let t=Math.ceil(lo/st)*st;t<=hi;t+=st){
    s+=`<line class="gl" x1="${P.l}" y1="${Y(t)}" x2="${W-P.r}" y2="${Y(t)}"/>`;
    s+=`<text class="ax" x="${P.l-9}" y="${Y(t)+3.5}" text-anchor="end">${t.toFixed(0)}${o.unit||"%"}</text>`;
  }
  if(lo<0&&hi>0) s+=`<line class="zero" x1="${P.l}" y1="${Y(0)}" x2="${W-P.r}" y2="${Y(0)}"/>`;
  o.labels.forEach((L,i)=>{ if(L) s+=`<text class="ax" x="${X(i)}" y="${H-7}" text-anchor="middle">${L}</text>`; });
  series.forEach(se=>{
    const pts=se.v.map((v,i)=>[i,v]).filter(p=>p[1]!=null);
    if(!pts.length) return;
    if(se.fill){
      let d=`M${X(pts[0][0])},${Y(0)}`;
      pts.forEach(([i,v])=>d+=`L${X(i)},${Y(v)}`);
      d+=`L${X(pts[pts.length-1][0])},${Y(0)}Z`;
      s+=`<path d="${d}" fill="${se.c}" fill-opacity=".13" stroke="none"/>`;
    }
    let d=""; pts.forEach(([i,v],j)=>d+=(j?"L":"M")+X(i)+","+Y(v));
    s+=`<path d="${d}" fill="none" stroke="${se.c}" stroke-width="2" stroke-linejoin="round"
         stroke-linecap="round"${se.dash?' stroke-dasharray="5 4"':''}/>`;
    const [li,lv]=pts[pts.length-1];
    s+=`<circle cx="${X(li)}" cy="${Y(lv)}" r="3.5" fill="${se.c}" stroke="var(--panel)" stroke-width="2"/>`;
    if(o.r!==0) s+=`<text class="dl" x="${X(li)+8}" y="${Y(lv)+3.5}" fill="${se.c}">${lv.toFixed(1)}${o.unit||"%"}</text>`;
  });
  s+=`<line id="ch" x1="0" y1="${P.t}" x2="0" y2="${H-P.b}" stroke="var(--ink-4)" stroke-width="1" opacity="0"/>`;
  s+=`<rect x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/></svg>`;
  node.innerHTML=s;
  const svg=node.querySelector("svg"),ch=svg.querySelector("#ch");
  svg.addEventListener("pointermove",e=>{
    const r=svg.getBoundingClientRect();
    let i=Math.round(((e.clientX-r.left)/r.width*W-P.l)/((W-P.l-P.r)/(n-1)));
    i=Math.max(0,Math.min(n-1,i));
    ch.setAttribute("x1",X(i));ch.setAttribute("x2",X(i));ch.setAttribute("opacity",".45");
    showTip(e,o.tip(i),series.filter(se=>se.v[i]!=null).map(se=>[se.n,pc(se.v[i])]));
  });
  svg.addEventListener("pointerleave",()=>{ch.setAttribute("opacity","0");hideTip();});
}

/* grouped / simple bars ----------------------------------------------- */
function bars(node,rows,o){
  const W=960,H=o.h||250,P={t:16,r:14,b:o.b||40,l:o.l||56};
  let lo=0,hi=0;
  rows.forEach(r=>r.v.forEach(v=>{lo=Math.min(lo,v);hi=Math.max(hi,v);}));
  const pad=(hi-lo)*.14||1; lo-=pad; hi+=pad;
  const Y=v=>P.t+(hi-v)*(H-P.t-P.b)/(hi-lo);
  const bw=(W-P.l-P.r)/rows.length, k=rows[0].v.length;
  const gw=Math.min(bw*0.66/k, 42);
  const st=nice((hi-lo)/4); let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}">`;
  for(let t=Math.ceil(lo/st)*st;t<=hi;t+=st){
    s+=`<line class="gl" x1="${P.l}" y1="${Y(t)}" x2="${W-P.r}" y2="${Y(t)}"/>`;
    s+=`<text class="ax" x="${P.l-9}" y="${Y(t)+3.5}" text-anchor="end">${o.fmtAx(t)}</text>`;
  }
  s+=`<line class="zero" x1="${P.l}" y1="${Y(0)}" x2="${W-P.r}" y2="${Y(0)}"/>`;
  rows.forEach((r,i)=>{
    const cx=P.l+i*bw+bw/2, span=gw*k+(k-1)*2;
    r.v.forEach((v,j)=>{
      const x=cx-span/2+j*(gw+2), h=Math.abs(Y(v)-Y(0));
      s+=`<rect data-i="${i}" x="${x}" y="${v>=0?Y(v):Y(0)}" width="${gw}"
           height="${Math.max(h,1)}" rx="3" fill="${o.colors[j]}"/>`;
    });
    s+=`<text class="ax" x="${cx}" y="${H-(o.sub?22:8)}" text-anchor="middle">${r.k}</text>`;
    if(o.sub) s+=`<text class="dl" x="${cx}" y="${H-6}" text-anchor="middle"
       fill="${o.sub(r)[1]}">${o.sub(r)[0]}</text>`;
  });
  s+=`</svg>`; node.innerHTML=s;
  node.querySelectorAll("rect[data-i]").forEach(el=>{
    const r=rows[+el.dataset.i]; bind(el,r.t,r.rows);
  });
}

/* horizontal bars ------------------------------------------------------ */
function hbars(node,rows,o){
  const W=960,H=o.h||210,P={t:10,r:20,b:24,l:o.l||104};
  const vals=rows.map(r=>r.v);
  const lo=Math.min(...vals,0)*1.15, hi=Math.max(...vals,0)*1.45;
  const X=v=>P.l+(v-lo)*(W-P.l-P.r)/(hi-lo), rh=(H-P.t-P.b)/rows.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.aria}">`;
  s+=`<line class="zero" x1="${X(0)}" y1="${P.t}" x2="${X(0)}" y2="${H-P.b}"/>`;
  rows.forEach((r,i)=>{
    const y=P.t+i*rh+4,h=rh-9;
    const x0=r.v<0?X(r.v):X(0), w=Math.abs(X(r.v)-X(0));
    s+=`<rect data-i="${i}" x="${x0}" y="${y}" width="${Math.max(w,2)}" height="${h}" rx="3" fill="${r.c}"/>`;
    s+=`<text class="ax" x="${P.l-10}" y="${y+h/2+3.5}" text-anchor="end"
         style="font-family:var(--sans);font-size:12px;fill:var(--ink-2)">${r.k}</text>`;
    const lx=r.v<0?x0-7:x0+w+7;
    s+=`<text class="dl" x="${lx}" y="${y+h/2+3.5}" text-anchor="${r.v<0?"end":"start"}"
         fill="var(--ink-2)">${o.fmt(r.v)}</text>`;
    if(r.side) s+=`<text class="ax" x="${X(0)+(r.v<0?7:-7)}" y="${y+h/2+3.5}"
         text-anchor="${r.v<0?"start":"end"}">${r.side}</text>`;
  });
  if(o.axis) s+=`<text class="ax" x="${X(0)}" y="${H-8}" text-anchor="middle">${o.axis}</text>`;
  s+=`</svg>`; node.innerHTML=s;
  node.querySelectorAll("rect[data-i]").forEach(el=>{
    const r=rows[+el.dataset.i]; if(r.rows) bind(el,r.t||r.k,r.rows);
  });
}

function statBand(){
  const cells=[];
  if(book==="C"){
    const a=D.books.A.withcall,d=D.books.D.withcall;
    const p=f=>[f(a),"Model D "+f(d)];
    cells.push(["Return /yr",...p(x=>x["Return_pa_%"].toFixed(2)+"%")]);
    cells.push(["Max drawdown",...p(x=>x["Max_DD_%"].toFixed(2)+"%")]);
    cells.push(["Volatility",...p(x=>x["Vol_%"].toFixed(2)+"%")]);
    cells.push(["Sharpe",...p(x=>x.Sharpe.toFixed(2))]);
    cells.push(["CAR / MDD",...p(x=>x.CAR_MDD.toFixed(2))]);
    cells.push(["Win months",...p(x=>x["Win_Months_%"].toFixed(1)+"%")]);
  } else {
    const b=B(),c=b.withcall,o=b.alone;
    const dl=(x,y,inv)=>{const v=x-y;return [`${v>=0?"+":""}${v.toFixed(2)} vs alone`,(inv?v<0:v>0)?"up":"dn"];};
    const add=(k,v,d)=>cells.push([k,v,d[0],d[1]]);
    add("Return /yr",c["Return_pa_%"].toFixed(2)+"%",dl(c["Return_pa_%"],o["Return_pa_%"]));
    add("Max drawdown",c["Max_DD_%"].toFixed(2)+"%",[dl(c["Max_DD_%"],o["Max_DD_%"])[0],"up"]);
    add("Volatility",c["Vol_%"].toFixed(2)+"%",[dl(c["Vol_%"],o["Vol_%"],true)[0],"up"]);
    add("Sharpe",c.Sharpe.toFixed(2),dl(c.Sharpe,o.Sharpe));
    add("Sortino",b.risk.call.sortino.toFixed(2),[`+${(b.risk.call.sortino-b.risk.alone.sortino).toFixed(2)} vs alone`,"up"]);
    add("Total profit",rs(c.Total_Profit_Rs),[`+${rs(c.Total_Profit_Rs-o.Total_Profit_Rs)} overlay`,"up"]);
  }
  return `<div class="band c12">${cells.map(c=>
    `<div class="s"><div class="k">${c[0]}</div><div class="v">${c[1]}</div>
     <div class="d ${c[3]||""}">${c[2]||""}</div></div>`).join("")}</div>`;
}

function heat(b){
  const byY={}; b.monthly.forEach(m=>{const[y,mo]=m.m.split("-");(byY[y]=byY[y]||{})[+mo-1]=m;});
  const mx=Math.max(...b.monthly.map(m=>Math.abs(m.pct)));
  const hm=$("#hm"); hm.innerHTML="";
  const cell=(cls,txt)=>{const d=document.createElement("div");d.className=cls;d.textContent=txt||"";return d;};
  hm.append(cell("hh"));
  MON.forEach(m=>hm.append(cell("hh",m)));
  Object.keys(byY).sort().forEach(y=>{
    hm.append(cell("yr",y));
    for(let i=0;i<12;i++){
      const m=byY[y][i], c=cell("");
      if(!m){ c.style.background="var(--line-2)"; }
      else{
        const t=Math.min(Math.abs(m.pct)/mx,1);
        c.style.background=`color-mix(in oklab, ${m.pct>=0?"var(--pos)":"var(--neg)"} ${(t*76+8).toFixed(0)}%, var(--panel))`;
        c.style.color = t>0.52 ? "#fff" : "var(--ink)";
        c.textContent=m.pct.toFixed(1);
        bind(c,MON[i]+" "+y,[["Equity",rs(m.eq)],["Overlay",rs(m.op)],
                             ["Total",rs(m.tot)],["On ₹1 Cr",pc(m.pct)]]);
      }
      hm.append(c);
    }
  });
}

  $("#vC").textContent = book==="C" ? "Model A vs Model D" : B().label+" + conditioned call";
  $("#view").innerHTML = fn();

}
